name: Deploy to GitHub Pages

# Production deploys only from version tags (vX.Y.Z) on commits in main.
# dev and untagged main commits are never deployed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tag pushed on a commit outside main (e.g. on dev) is not deployed.
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
        env:
          BASE_PATH: /
          # Public values: the publishable key is meant to ship in the client bundle.
          PUBLIC_SUPABASE_URL: https://vfnpkkzaxsraakeacchg.supabase.co
          # Repository variable (Settings → Secrets and variables → Actions → Variables).
          PUBLIC_WORLD_URL: ${{ vars.WORLD_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7iAuefoe5tkTwRg9oyqfXQ_WH-hbh_3
      # GitHub Pages has no SPA fallback: serve the app for unknown paths like /inbox.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
