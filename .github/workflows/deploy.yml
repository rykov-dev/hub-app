name: Deploy to GitHub Pages

# Only the release branch is deployed; main is for development.
on:
  push:
    branches: [release/v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A manual run started from another branch is skipped, not deployed.
    if: github.ref == 'refs/heads/release/v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Public values: the publishable key is meant to ship in the client bundle.
          PUBLIC_SUPABASE_URL: https://vfnpkkzaxsraakeacchg.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7iAuefoe5tkTwRg9oyqfXQ_WH-hbh_3
      # GitHub Pages has no SPA fallback: serve the app for unknown paths like /inbox.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
